<div>
  <label class="block font-medium mb-2" for="sport-selector"> Omiljeni sportovi (najvise 5) </label>
  <p class="text-sm text-muted mt-2 mb-2">
    Za izbor vise sportova drzite Cmd na Mac-u ili Ctrl na Windows-u i Linux-u.
  </p>
  <select
    id="sport-selector"
    class="w-full border rounded p-2 focus:outline-primary"
    name="sportSelection"
    multiple
    size="6"
    [ngModel]="selectedSports"
    (ngModelChange)="updateSelection($event)"
  >
    @for (sport of sports; track sport.name) {
    <option [value]="sport.name">{{ sport.name }}</option>
    }
  </select>

  @if (message) {
  <p class="text-danger mt-2 mb-0">{{ message }}</p>
  }
</div>
