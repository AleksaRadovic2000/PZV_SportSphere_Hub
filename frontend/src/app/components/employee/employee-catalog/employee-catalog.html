<div class="flex flex-col gap-6">
  <section class="bg-surface border rounded-lg shadow p-6">
    <h1 class="text-2xl mt-2 mb-6">Katalog i porudzbine</h1>
    <div class="max-w-md">
      <label class="block font-medium mb-2" for="catalog-facility">Sportski objekat</label>
      <select
        id="catalog-facility"
        class="w-full border rounded p-2"
        name="facilityId"
        [(ngModel)]="facilityId"
      >
        @for (facility of facilities; track facility._id) {
        <option [value]="facility._id">{{ facility.name }} - {{ facility.city }}</option>
        }
      </select>
    </div>
    @if (message) {
    <p class="text-danger mt-4">{{ message }}</p>
    }
  </section>

  @if (selectedFacility; as facility) {
  <app-employee-promotions [facility]="facility" [sports]="sports" />
  <app-employee-products
    [facilityId]="facility._id"
    [sports]="sports"
    [refreshToken]="productsRefresh"
  />
  <app-employee-orders [facilityId]="facility._id" (productsChanged)="refreshProducts()" />
  }
</div>
