<section class="max-w-xl mx-auto bg-surface border rounded-lg shadow p-6">
  <h1 class="text-2xl text-center mt-2 mb-6">Profil zaposlenog</h1>

  <form class="flex flex-col gap-4" (ngSubmit)="updateProfile()">
    @if (profileImagePreview) {
      <div class="flex justify-center">
        <img
          class="border rounded-full p-2"
          width="160"
          height="160"
          [src]="profileImagePreview"
          alt="Profilna slika"
        />
      </div>
    }

    <div>
      <label class="block font-medium mb-2" for="employee-username">Korisnicko ime</label>
      <input
        id="employee-username"
        class="w-full border rounded p-2"
        name="username"
        [(ngModel)]="user.username"
        readonly
      />
    </div>

    <div class="flex flex-col gap-4 md:flex-row">
      <div class="flex-1">
        <label class="block font-medium mb-2" for="employee-first-name">Ime</label>
        <input
          id="employee-first-name"
          class="w-full border rounded p-2 focus:outline-primary"
          name="firstName"
          [(ngModel)]="user.firstName"
        />
      </div>

      <div class="flex-1">
        <label class="block font-medium mb-2" for="employee-last-name">Prezime</label>
        <input
          id="employee-last-name"
          class="w-full border rounded p-2 focus:outline-primary"
          name="lastName"
          [(ngModel)]="user.lastName"
        />
      </div>
    </div>

    <div class="flex flex-col gap-4 md:flex-row">
      <div class="flex-1">
        <label class="block font-medium mb-2" for="employee-phone">Telefon</label>
        <input
          id="employee-phone"
          class="w-full border rounded p-2 focus:outline-primary"
          name="phone"
          [(ngModel)]="user.phone"
        />
      </div>

      <div class="flex-1">
        <label class="block font-medium mb-2" for="employee-email">Email</label>
        <input
          id="employee-email"
          class="w-full border rounded p-2 focus:outline-primary"
          name="email"
          type="email"
          [(ngModel)]="user.email"
        />
      </div>
    </div>

    <div class="flex flex-col gap-4 md:flex-row">
      <div class="flex-1">
        <label class="block font-medium mb-2" for="company-name">Naziv objekta</label>
        <input
          id="company-name"
          class="w-full border rounded p-2"
          name="companyName"
          [(ngModel)]="user.companyName"
          readonly
        />
      </div>

      <div class="flex-1">
        <label class="block font-medium mb-2" for="company-address">Adresa sedista</label>
        <input
          id="company-address"
          class="w-full border rounded p-2"
          name="companyAddress"
          [(ngModel)]="user.companyAddress"
          readonly
        />
      </div>
    </div>

    <div class="flex flex-col gap-4 md:flex-row">
      <div class="flex-1">
        <label class="block font-medium mb-2" for="registration-number">Maticni broj</label>
        <input
          id="registration-number"
          class="w-full border rounded p-2"
          name="registrationNumber"
          [(ngModel)]="user.registrationNumber"
          readonly
        />
      </div>

      <div class="flex-1">
        <label class="block font-medium mb-2" for="tax-id">PIB</label>
        <input
          id="tax-id"
          class="w-full border rounded p-2"
          name="taxId"
          [(ngModel)]="user.taxId"
          readonly
        />
      </div>
    </div>

    <div>
      <label class="block font-medium mb-2" for="employee-profile-image">
        Nova profilna slika
      </label>
      <input
        id="employee-profile-image"
        class="w-full border rounded p-2"
        type="file"
        accept="image/png,image/jpeg"
        (change)="onProfileImageSelected($event)"
      />
    </div>

    @if (message) {
      <p [class]="success ? 'text-success m-0' : 'text-danger m-0'">
        {{ message }}
      </p>
    }

    <button
      class="bg-primary text-white border-0 rounded px-4 py-2 cursor-pointer transition-colors hover:bg-primary-dark disabled:opacity-50 disabled:cursor-not-allowed"
      type="submit"
      [disabled]="loading"
    >
      Sacuvaj izmene
    </button>
  </form>
</section>
