<section class="max-w-md mx-auto bg-surface border rounded-lg shadow p-6">
  <h1 class="text-2xl text-center mt-2 mb-6">Nova lozinka</h1>

  <form class="flex flex-col gap-4" (ngSubmit)="resetPassword()">
    <div>
      <label class="block font-medium mb-2" for="new-password">Nova lozinka</label>
      <input
        id="new-password"
        class="w-full border rounded p-2 focus:outline-primary"
        name="newPassword"
        type="password"
        [(ngModel)]="newPassword"
        autocomplete="new-password"
      />
    </div>

    <div>
      <label class="block font-medium mb-2" for="password-confirmation">Ponovljena lozinka</label>
      <input
        id="password-confirmation"
        class="w-full border rounded p-2 focus:outline-primary"
        name="passwordConfirmation"
        type="password"
        [(ngModel)]="passwordConfirmation"
        autocomplete="new-password"
      />
    </div>

    @if (message) {
      <p [class]="success ? 'text-success m-0' : 'text-danger m-0'">{{ message }}</p>
    }

    <button
      class="bg-primary text-white border-0 rounded px-4 py-2 cursor-pointer transition-colors hover:bg-primary-dark disabled:opacity-50 disabled:cursor-not-allowed"
      type="submit"
      [disabled]="loading"
    >
      Promeni lozinku
    </button>
  </form>

  @if (success) {
    <a class="inline-block text-primary mt-4" routerLink="/">Vrati se na prijavu</a>
  }
</section>
