<section class="max-w-md mx-auto bg-surface border rounded-lg shadow p-6">
  <h1 class="text-2xl text-center mt-2 mb-2">Zaboravljena lozinka</h1>
  <p class="text-muted text-center mt-2 mb-6">Link za promenu lozinke vazi 30 minuta.</p>

  <form class="flex flex-col gap-4" (ngSubmit)="requestResetLink()">
    <div>
      <label class="block font-medium mb-2" for="identifier">Korisnicko ime ili email</label>
      <input
        id="identifier"
        class="w-full border rounded p-2 focus:outline-primary"
        name="identifier"
        [(ngModel)]="identifier"
      />
    </div>

    <button
      class="bg-primary text-white border-0 rounded px-4 py-2 cursor-pointer transition-colors hover:bg-primary-dark disabled:opacity-50 disabled:cursor-not-allowed"
      type="submit"
      [disabled]="loading"
    >
      Kreiraj privremeni link
    </button>
  </form>

  @if (message) {
  <p class="mt-4 mb-2">{{ message }}</p>
  } @if (resetUrl) {
  <a class="text-primary" [href]="resetUrl">Postavi novu lozinku</a>
  }
</section>
